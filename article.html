    <style>
      .article-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 24px; }
      .listen-button, .listen-stop, .share-button { cursor: pointer; border-radius: 3px; padding: 9px 13px; font-weight: 600; }
      .listen-button { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
      .listen-stop, .share-button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
      .listen-button:hover { filter: brightness(.94); }
      .listen-stop:hover, .share-button:hover { border-color: var(--muted); }
      .listen-button:focus-visible, .listen-stop:focus-visible, .share-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
      .listen-status, .share-status { color: var(--muted); font-size: 13px; }
      @media (max-width: 520px) { .listen-status, .share-status { flex-basis: 100%; } }
    </style>
  </head>
  <body class="article-page">
    <a class="skip-link" href="#article-root">Ir para o artigo</a>

        <a class="header-link" href="index.html#recent-posts">← Todos os artigos</a>
      </div>
    </header>

    <main class="article-shell" id="article-root">
      <header class="article-header">
        <span class="eyebrow" id="article-category">Carregando artigo</span>
        <h1 id="article-heading">Carregando artigo…</h1>
        <p class="dek" id="article-dek"></p>
        <div class="article-meta" id="article-meta"></div>
        <div class="article-actions" id="article-actions" hidden>
          <button class="listen-button" id="listen-article" type="button" aria-pressed="false">Ouvir artigo</button>
          <button class="listen-stop" id="stop-listening" type="button" hidden>Parar</button>
          <button class="share-button" id="share-article" type="button">Compartilhar</button>
          <span class="listen-status" id="listen-status" role="status" aria-live="polite"></span>
          <span class="share-status" id="share-status" role="status" aria-live="polite"></span>
        </div>
      </header>
      <div class="article-hero" hidden><img id="article-image" alt="" /></div>
      <article class="article-body" id="article-body"><p>Carregando o conteúdo…</p></article>
      <noscript><p>Ative o JavaScript para carregar o conteúdo deste artigo.</p></noscript>
