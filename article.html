<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="article-description" name="description" content="Artigo do arquivo Tech Topics." />
    <title>Tech Topics</title>
    <meta name="theme-color" content="#277d69" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tech Topics" />
    <link rel="manifest" href="manifest.webmanifest?v=20260927" />
    <link rel="icon" href="favicon.svg?v=20260927" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="assets/favicon-32x32.png?v=20260927" type="image/png" sizes="32x32" />
    <link rel="icon" href="assets/favicon-16x16.png?v=20260927" type="image/png" sizes="16x16" />
    <link rel="shortcut icon" href="favicon.ico?v=20260927" />
    <link rel="apple-touch-icon" href="assets/app-icon-180.png?v=20260927" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .article-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 24px; }
      .listen-button, .listen-stop, .share-button { cursor: pointer; border-radius: 3px; padding: 9px 13px; font-weight: 600; }
      .listen-button { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
      .listen-stop, .share-button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
      .listen-button:hover { filter: brightness(.94); }
      .listen-stop:hover, .share-button:hover { border-color: var(--muted); }
      .listen-button:focus-visible, .listen-stop:focus-visible, .share-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
      .listen-status, .share-status { color: var(--muted); font-size: 13px; }
      @media (max-width: 520px) { .listen-status, .share-status { flex-basis: 100%; } }
    </style>
  </head>
  <body class="article-page">
    <a class="skip-link" href="#article-root">Ir para o artigo</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="Tech Topics — página inicial">Tech Topics</a>
        <a class="header-link" href="index.html#recent-posts">← Todos os artigos</a>
      </div>
    </header>

    <main class="article-shell" id="article-root">
      <header class="article-header">
        <span class="eyebrow" id="article-category">Carregando artigo</span>
        <h1 id="article-heading">Carregando artigo…</h1>
        <p class="dek" id="article-dek"></p>
        <div class="article-meta" id="article-meta"></div>
        <div class="article-actions" id="article-actions" hidden>
          <button class="listen-button recording-trigger" id="listen-recording" type="button" aria-pressed="false">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><rect x="2.5" y="13" width="4.5" height="7" rx="2"/><rect x="17" y="13" width="4.5" height="7" rx="2"/></svg>
            <span class="recording-button-label">Ouvir artigo</span>
          </button>
          <button class="share-button" id="share-article" type="button">Compartilhar</button>
          <span class="listen-status" id="listen-status" role="status" aria-live="polite"></span>
          <span class="listen-status" id="recording-status" role="status" aria-live="polite"></span>
          <span class="share-status" id="share-status" role="status" aria-live="polite"></span>
        </div>

      </header>
      <div class="article-hero" hidden><img id="article-image" alt="" /></div>
      <article class="article-body" id="article-body"><p>Carregando o conteúdo…</p></article>
      <noscript><p>Ative o JavaScript para carregar o conteúdo deste artigo.</p></noscript>
    </main>

    <section class="speech-player" id="speech-player" aria-label="Player de leitura do artigo" hidden>
      <div class="speech-player-inner">
        <span class="speech-position" id="speech-position"></span>
        <div class="speech-player-controls">
          <button id="speech-previous" type="button" aria-label="Ler trecho anterior">← Anterior</button>
          <button id="speech-play" type="button">Pausar</button>
          <button id="speech-next" type="button" aria-label="Ler próximo trecho">Próximo →</button>
          <button id="speech-stop" type="button">Parar</button>
        </div>
        <label class="speech-follow"><input id="speech-follow" type="checkbox" checked /> Acompanhar leitura</label>
      </div>
    </section>

    <section class="recording-dock" id="recording-player" aria-label="Player do áudio gravado do artigo" hidden>
      <audio id="article-recording" preload="none"></audio>
      <div class="recording-cover-ring" id="recording-ring">
        <img id="recording-cover" alt="" />
      </div>
      <div class="recording-info">
        <strong id="recording-title" class="recording-title"></strong>
        <span class="recording-subtitle" id="recording-subtitle">Tech Topics · Narração</span>
        <div class="recording-progress">
          <span id="recording-elapsed" class="recording-time">0:00</span>
          <input id="recording-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Posição da narração" disabled />
          <span id="recording-duration" class="recording-time">–:––</span>
        </div>
      </div>
      <div class="recording-actions">
        <button id="recording-rate" class="recording-rate" type="button" aria-label="Velocidade da narração: 1 vez">1×</button>
        <button id="recording-previous" class="recording-skip" type="button" aria-label="Parágrafo anterior" title="Parágrafo anterior" disabled>
          <svg aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M19 5 10 12l9 7V5Z"/><path d="M6 5v14"/></svg>
        </button>
        <button id="recording-play" class="recording-play" type="button" data-playing="false" aria-label="Reproduzir narração" aria-pressed="false">
          <svg class="recording-icon-play" aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5a1 1 0 0 1 1.5-.86l12 7.5a1 1 0 0 1 0 1.72l-12 7.5A1 1 0 0 1 7 19.5z"/></svg>
          <svg class="recording-icon-pause" aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
        </button>
        <button id="recording-skip" class="recording-skip" type="button" aria-label="Próximo parágrafo" title="Próximo parágrafo" disabled>
          <svg aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="m5 5 9 7-9 7V5Z"/><path d="M18 5v14"/></svg>
        </button>
        <details class="recording-options">
          <summary aria-label="Outras opções de áudio" title="Outras opções de áudio">···</summary>
          <div class="recording-options-menu">
            <button id="listen-article" type="button" aria-pressed="false">Usar voz do dispositivo</button>
            <label class="recording-follow"><input id="recording-follow" type="checkbox" checked /> Acompanhar parágrafo</label>
          </div>
        </details>
        <button id="recording-close" class="recording-close" type="button" aria-label="Fechar player" title="Fechar player">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"><path d="M5 5 19 19M19 5 5 19"/></svg>
        </button>
      </div>
    </section>
    <footer class="site-footer">
      <div class="footer-inner">
        <p>Tech Topics · Arquivo de arquitetura e engenharia de software</p>
      </div>
    </footer>
    <script src="fgs-simulator.js"></script>
    <script src="mermaid-theme.js?v=20260920-mermaid"></script>
    <script src="speech.js"></script>
    <script src="audio.js?v=20261022-sync"></script>
    <script src="article.js?v=20261022-sync"></script>
    <script src="pwa.js"></script>
  </body>
</html>
