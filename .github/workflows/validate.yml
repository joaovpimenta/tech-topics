name: Validate Tech Topics

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Content and application lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tech Topics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the compiler toolchain
        run: npm ci
      - name: Set up Python for lightweight TTS tests
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Run all validation gates
        run: node scripts/validate-site.mjs
        env:
          TECH_TOPICS_REQUIRE_TTS_TESTS: "1"

  browser:
    name: Mobile UI geometry and touch gestures
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out Tech Topics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the compiler toolchain
        run: npm ci
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install chromium --with-deps
      - name: Build the public HTML artifact
        run: |
          node scripts/build-articles.mjs
          node scripts/build-site.mjs
      - name: Verify real Chromium geometry and touch input
        run: python scripts/test-ui-browser.py
        env:
          TECH_TOPICS_UI_SCREENSHOTS: test-results/responsive
      - name: Save responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: test-results/responsive/
          if-no-files-found: ignore
      - name: Open the staged Markdown package in real Chromium
        run: python scripts/test-markdown-preview-browser.py
      - name: Open every published article from dist in desktop and mobile Chromium
        run: python scripts/test-html-site-browser.py
      - name: Verify article recommendations
        run: python scripts/test-recommendations-browser.py
