name: Validate Tech Topics

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Content and application lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tech Topics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all validation gates
        run: node scripts/validate-site.mjs
