name: Validate Tech Topics

on:
  pull_request:
    paths:
      - "**.html"
      - "**.css"
      - "**.js"
      - "**.mjs"
      - "**.cjs"
      - "**.json"
      - "docs/**"
      - ".github/workflows/**"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Content and application lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tech Topics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build article manifest
        run: node scripts/build-articles.mjs
      - name: Run deterministic content lint
        run: node scripts/lint-articles.mjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check article.js
          node --check fgs-simulator.js
          node --check mermaid-theme.js
      - name: Run application tests
        run: |
          node scripts/test-pwa.cjs
          node scripts/test-fgs.cjs
          node scripts/test-diagrams.cjs
