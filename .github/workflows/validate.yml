name: Validate Tech Topics

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Content and application lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tech Topics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Set up Python for lightweight TTS tests
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Run all validation gates
        run: node scripts/validate-site.mjs
        env:
          TECH_TOPICS_REQUIRE_TTS_TESTS: "1"

  sentence-preview-oneoff:
    name: Real Kokoro sentence sample (temporary)
    if: github.head_ref == 'feat/tts-sentence-navigation-20261022'
    permissions:
      contents: read
    uses: ./.github/workflows/kokoro-audio.yml
    with:
      article: bulkhead
      mode: preview
      replace_existing: false
