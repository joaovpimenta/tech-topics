name: Validate Tech Topics

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Content and application lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tech Topics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Set up Python for lightweight TTS tests
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Run all validation gates
        run: node scripts/validate-site.mjs
        env:
          TECH_TOPICS_REQUIRE_TTS_TESTS: "1"

  # One-off listening review; remove after artifact is generated.
  sentence-dora-comparison:
    name: Dora 320-char sentence comparison (one-off)
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/kokoro-dora-prosody-compare-20261022' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install CPU-only Kokoro
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng libespeak-ng1 ffmpeg
          python -m pip install "kokoro-onnx==0.6.1" "misaki-fork==0.9.6" "phonemizer-fork==3.3.2" "espeakng-loader==0.2.4" "soundfile==0.13.1"
      - uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-v1.0-fp32-voices-model-files-v1.1
      - name: Generate nine sentence-first audio clips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/kokoro
          base="https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1"
          for file in kokoro-v1.0.onnx voices-v1.0.bin; do
            if [ ! -s ".cache/kokoro/$file" ]; then
              curl --fail --location --retry 3 --silent --show-error "$base/$file" -o ".cache/kokoro/$file"
            fi
          done
          test "$(stat -c '%s' .cache/kokoro/kokoro-v1.0.onnx)" -gt 250000000
          test "$(stat -c '%s' .cache/kokoro/voices-v1.0.bin)" -gt 20000000
          python tools/tts/kokoro_release.py compare --slug bulkhead \
            --output-dir .audio/compare --model .cache/kokoro/kokoro-v1.0.onnx \
            --voices .cache/kokoro/voices-v1.0.bin
          for preset in atual equilibrado fluido; do
            for speed in 095 100 105; do
              folder=".audio/compare/$preset-$speed"
              ffmpeg -hide_banner -loglevel error -y \
                -i "$folder/bulkhead.wav" -af "loudnorm=I=-19:TP=-1:LRA=11" \
                -ar 24000 -ac 1 -c:a libmp3lame -b:a 96k "$folder/bulkhead.mp3"
              test -s "$folder/bulkhead.mp3"
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path(".audio/compare")
          data = json.loads((folder / "comparison.json").read_text())
          assert data["voice"] == "pf_dora"
          assert len(data["variants"]) == 9
          transcripts = []
          all_splits = []
          for sample in data["variants"]:
              root = folder / sample["name"]
              parts = json.loads((root / "bulkhead.segments.json").read_text())
              assert all(len(p["text"]) <= 320 for p in parts)
              assert set(p["block_index"] for p in parts) == {0, 1}
              all_splits.append([(p["text"][-35:], p.get("split_reason")) for p in parts])
              transcripts.append(" ".join(" ".join(p["text"] for p in parts).split()))
          assert len(set(transcripts)) == 1
          assert "No corredor de manutenção de uma balsa" in transcripts[0]
          print("PASS: 9 identically narrated title + opening metaphor variants; sentence-first, <=320 chars")
          print("One sample's end-of-chunk boundaries:", all_splits[0])
          PY
      - name: Save sentence-first listening artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dora-bulkhead-sentence-320-nine
          path: |
            .audio/compare/comparison.json
            .audio/compare/*/*.mp3
            .audio/compare/*/*.txt
            .audio/compare/*/*.metrics.json
            .audio/compare/*/*.segments.json
          retention-days: 14
          if-no-files-found: error
