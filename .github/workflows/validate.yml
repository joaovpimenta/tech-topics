name: Validate Tech Topics

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Content and application lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tech Topics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Set up Python for lightweight TTS tests
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Run all validation gates
        run: node scripts/validate-site.mjs
        env:
          TECH_TOPICS_REQUIRE_TTS_TESTS: "1"

  # One-off PR evaluation; remove after producing the listening artifact.
  short-dora-comparison:
    name: Dora 9 short A/B samples (one-off)
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/kokoro-dora-prosody-compare-20261022' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install Dora CPU-only dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng libespeak-ng1 ffmpeg
          python -m pip install "kokoro-onnx==0.6.1" "misaki-fork==0.9.6" "phonemizer-fork==3.3.2" "espeakng-loader==0.2.4" "soundfile==0.13.1"
      - uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-v1.0-fp32-voices-model-files-v1.1
      - name: Prepare Kokoro FP32 once and synthesize 9 short Dora combinations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/kokoro
          base="https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1"
          for file in kokoro-v1.0.onnx voices-v1.0.bin; do
            if [ ! -s ".cache/kokoro/$file" ]; then
              curl --fail --location --retry 3 --silent --show-error "$base/$file" -o ".cache/kokoro/$file"
            fi
          done
          test "$(stat -c '%s' .cache/kokoro/kokoro-v1.0.onnx)" -gt 250000000
          test "$(stat -c '%s' .cache/kokoro/voices-v1.0.bin)" -gt 20000000
          python tools/tts/kokoro_release.py compare --slug bulkhead \
            --output-dir .audio/compare --model .cache/kokoro/kokoro-v1.0.onnx \
            --voices .cache/kokoro/voices-v1.0.bin
          for preset in atual equilibrado fluido; do
            for speed in 095 100 105; do
              name="$preset-$speed"
              ffmpeg -hide_banner -loglevel error -y \
                -i ".audio/compare/$name/bulkhead.wav" \
                -af "loudnorm=I=-19:TP=-1:LRA=11" \
                -ar 24000 -ac 1 -c:a libmp3lame -b:a 96k \
                ".audio/compare/$name/bulkhead.mp3"
              test -s ".audio/compare/$name/bulkhead.mp3"
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path(".audio/compare/comparison.json").read_text())
          assert data["voice"] == "pf_dora" and len(data["variants"]) == 9
          assert data["selection"] == "title_plus_first_body_paragraph"
          transcripts = [
              " ".join((Path(".audio/compare") / entry["name"] / "bulkhead.txt").read_text().split())
              for entry in data["variants"]
          ]
          assert len(set(transcripts)) == 1
          assert "No corredor de manutenção de uma balsa" in transcripts[0]
          assert "Como dividir concorrência" not in transcripts[0]
          print("PASS: nine identical title+metaphor transcripts; 3 pause presets x 3 speeds")
          PY
      - name: Save the listening samples
        uses: actions/upload-artifact@v4
        with:
          name: dora-bulkhead-intro-9-variants
          path: |
            .audio/compare/comparison.json
            .audio/compare/*/*.mp3
            .audio/compare/*/*.txt
            .audio/compare/*/*.metrics.json
          retention-days: 14
          if-no-files-found: error
