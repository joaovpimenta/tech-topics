name: Validate complete Bulkhead narration (one-off)

on:
  push:
    branches:
      - feat/tts-bulkhead-full-review-20261022

permissions:
  contents: write

jobs:
  run-bulkhead-review:
    if: contains(github.event.head_commit.message, '[bulkhead-review]')
    uses: ./.github/workflows/kokoro-audio.yml
    with:
      article: bulkhead
      mode: review
      replace_existing: false
