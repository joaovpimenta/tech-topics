name: Build and deploy Tech Topics to GitHub Pages

on:
  push:
    branches: ["main"]
    # Skip editorial instructions and support tooling, but publish runtime taxonomy changes.
    paths:
      - "**"
      - "!docs/**"
      - "!README.md"
      - "!AGENTS.md"
      - "!CONTEXT.md"
      - "!generation/**"
      - "generation/taxonomy/tags.json"
      - "!tools/tts/**"
      - "!.github/workflows/validate.yml"
  workflow_dispatch:
    inputs:
      generate_audio:
        description: "Generate article audio (frozen during Markdown migration)"
        type: boolean
        required: false
        default: false
      advance_topic:
        description: "Advance the editorial queue (frozen during Markdown migration)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before deploy
    runs-on: ubuntu-latest
    outputs:
      new_article_slugs: ${{ steps.new_articles.outputs.slugs }}
      changed_speech_slugs: ${{ steps.changed_speech.outputs.slugs }}
      article_build_id: ${{ steps.artifact_identity.outputs.build_id }}
      deployed_before_sha: ${{ steps.deployed_before.outputs.sha }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out Tech Topics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the compiler toolchain
        run: npm ci
      - name: Set up Python for lightweight TTS tests
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Run all validation gates
        run: node scripts/validate-site.mjs
        env:
          TECH_TOPICS_REQUIRE_TTS_TESTS: "1"
      - name: Build the production HTML artifact
        run: node scripts/build-site.mjs
      - name: Resolve the last successfully deployed Pages revision
        id: deployed_before
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')" = "$EXPECTED_SHA"
          sha=""
          while IFS=$'\t' read -r run_id head_sha; do
            if [[ ! "$run_id" =~ ^[0-9]+$ || ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              continue
            fi
            jobs="$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100")"
            if jq -e '[.jobs[] | select(.name == "Deploy GitHub Pages" and .conclusion == "success")] | length > 0' <<<"$jobs" >/dev/null; then
              sha="$head_sha"
              break
            fi
          done < <(gh api --paginate "repos/$GH_REPO/actions/workflows/pages.yml/runs?branch=main&per_page=100" --jq '.workflow_runs[] | [.id, .head_sha] | @tsv')
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No previous successful Pages deployment revision is available." >&2
            exit 1
          fi
          git cat-file -e "$sha^{commit}"
          if ! git merge-base --is-ancestor "$sha" "$EXPECTED_SHA"; then
            echo "Last deployed revision is not an ancestor of the current source revision." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Capture the validated HTML artifact identity
        id: artifact_identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          catalog = json.loads(Path("dist/assets/articles-catalog.json").read_text(encoding="utf-8"))
          if isinstance(catalog, list):
              build_id = ""
              print("Legacy JSON artifact has no HTML build identity; downstream effects stay blocked.")
          else:
              if catalog.get("transport") != "html-v1" or catalog.get("sourceSha") != os.environ["EXPECTED_SOURCE_SHA"]:
                  raise SystemExit("Validated HTML artifact does not match the triggering source revision.")
              build_id = catalog.get("buildId", "")
              if len(build_id) != 64 or any(char not in "0123456789abcdef" for char in build_id):
                  raise SystemExit("Validated HTML artifact has an invalid buildId.")
              subprocess.run([
                  "python", "tools/tts/article_selection.py", "--verify-artifact",
                  "--after", os.environ["EXPECTED_SOURCE_SHA"], "--build-id", build_id,
              ], check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"build_id={build_id}\n")
          PY
      - name: Detect newly published article sources (not page/code edits)
        id: new_articles
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BEFORE_SHA: ${{ steps.deployed_before.outputs.sha }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          slugs="$(python tools/tts/article_selection.py --before "$BEFORE_SHA" --after "$AFTER_SHA")"
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          if [ "$slugs" = '[]' ]; then
            echo "No new article: skip Kokoro; deploy site changes only." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "New articles (Kokoro eligible): $slugs" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Detect edited articles whose spoken narration changed
        id: changed_speech
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BEFORE_SHA: ${{ steps.deployed_before.outputs.sha }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          slugs="$(python tools/tts/article_selection.py --before "$BEFORE_SHA" --after "$AFTER_SHA" --spoken-changes)"
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Existing articles with changed speech: $slugs" >> "$GITHUB_STEP_SUMMARY"
      - name: Block unreviewed narration and chapter mapping changes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BEFORE_SHA: ${{ steps.deployed_before.outputs.sha }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python tools/tts/article_selection.py --before "$BEFORE_SHA" --after "$AFTER_SHA" --narration-impact --check-compatible
      - name: Install Chromium for publication parity audit
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install chromium --with-deps
      - name: Compare deployed and candidate browser narration
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          BEFORE_SHA: ${{ steps.deployed_before.outputs.sha }}
          AFTER_SHA: ${{ github.sha }}
        run: python scripts/audit-publication-parity.py --before "$BEFORE_SHA" --after "$AFTER_SHA"
      - name: Upload validated site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    name: Deploy GitHub Pages
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy validated artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-audio:
    name: Publish new article audio after successful deploy
    if: >-
      inputs.generate_audio == true && false &&
      github.event_name == 'push' &&
      needs.validate.outputs.article_build_id != '' &&
      needs.validate.outputs.new_article_slugs != '' &&
      needs.validate.outputs.new_article_slugs != '[]'
    needs: [validate, deploy]
    permissions:
      contents: write
    uses: ./.github/workflows/kokoro-audio.yml
    with:
      generate_audio: false
      before_sha: ${{ needs.validate.outputs.deployed_before_sha }}
      after_sha: ${{ github.sha }}
      expected_build_id: ${{ needs.validate.outputs.article_build_id }}

  republish-edited-audio:
    name: Rebuild only changed spoken audio after deploy
    if: >-
      inputs.generate_audio == true && false &&
      github.event_name == 'push' &&
      needs.validate.outputs.article_build_id != '' &&
      needs.validate.outputs.changed_speech_slugs != '' &&
      needs.validate.outputs.changed_speech_slugs != '[]'
    needs: [validate, deploy]
    permissions:
      contents: write
    uses: ./.github/workflows/kokoro-audio.yml
    with:
      generate_audio: false
      before_sha: ${{ needs.validate.outputs.deployed_before_sha }}
      after_sha: ${{ github.sha }}
      expected_build_id: ${{ needs.validate.outputs.article_build_id }}
      mode: publish
      replace_existing: true
      refresh_existing: true

  select-next-topic:
    name: Select next editorial topic after deploy
    if: >-
      inputs.advance_topic == true && false &&
      github.event_name == 'push' &&
      needs.validate.outputs.article_build_id != '' &&
      needs.validate.outputs.new_article_slugs != '' &&
      needs.validate.outputs.new_article_slugs != '[]'
    needs: [validate, deploy]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/select-next-topic.yml
    with:
      advance_topic: false
      expected_source_sha: ${{ github.sha }}
      expected_build_id: ${{ needs.validate.outputs.article_build_id }}
