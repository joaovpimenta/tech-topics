name: Build and deploy Tech Topics to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before deploy
    runs-on: ubuntu-latest
    outputs:
      new_article_slugs: ${{ steps.new_articles.outputs.slugs }}
    permissions:
      contents: read
    steps:
      - name: Check out Tech Topics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Set up Python for lightweight TTS tests
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Run all validation gates
        run: node scripts/validate-site.mjs
        env:
          TECH_TOPICS_REQUIRE_TTS_TESTS: "1"
      - name: Detect newly published article JSONs (not page/code edits)
        id: new_articles
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          slugs="$(python tools/tts/article_selection.py --before "$BEFORE_SHA" --after "$AFTER_SHA")"
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          if [ "$slugs" = '[]' ]; then
            echo "No new article: skip Kokoro; deploy site changes only." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "New articles (Kokoro eligible): $slugs" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload validated site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    name: Deploy GitHub Pages
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy validated artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-audio:
    name: Publish new article audio after successful deploy
    if: >-
      github.event_name == 'push' &&
      needs.validate.outputs.new_article_slugs != '' &&
      needs.validate.outputs.new_article_slugs != '[]'
    needs: [validate, deploy]
    permissions:
      contents: write
    uses: ./.github/workflows/kokoro-audio.yml
    with:
      before_sha: ${{ github.event.before }}
      after_sha: ${{ github.sha }}
