name: Select next Tech Topics article

on:
  # Called by Pages only when a newly added article deployed successfully.
  workflow_call:
    inputs:
      advance_topic:
        type: boolean
        required: false
        default: false
      expected_source_sha:
        type: string
        required: false
        default: ""
      expected_build_id:
        type: string
        required: false
        default: ""
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      advance_topic:
        description: "Advance editorial queue (frozen during Markdown migration)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: tech-topics-queue
  cancel-in-progress: false

jobs:
  select:
    if: >-
      (inputs.advance_topic == true && false) &&
      ((github.event_name == 'push' && inputs.expected_source_sha == github.sha && inputs.expected_build_id != '') ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 21 && github.event.comment.user.login == github.repository_owner && contains(github.event.comment.body, '<!-- tech-topics:candidates:v1 -->')) ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Check out published articles
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_source_sha || 'main' }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the compiler toolchain
        run: npm ci
      - uses: actions/setup-python@v5
        if: github.event_name == 'push'
        with:
          python-version-file: .python-version
      - name: Validate the deployed revision and HTML artifact
        if: github.event_name == 'push'
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_BUILD_ID: ${{ inputs.expected_build_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')" = "$EXPECTED_SOURCE_SHA"
          node scripts/validate-site.mjs
          node scripts/build-site.mjs
          python tools/tts/article_selection.py \
            --verify-artifact --after "$EXPECTED_SOURCE_SHA" --build-id "$EXPECTED_BUILD_ID"
      - name: Select one unpublished candidate
        run: node scripts/select-next-topic.mjs --json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC_QUEUE_ISSUE_NUMBER: 21
          TOPIC_QUEUE_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          TOPIC_QUEUE_BUILD_ID: ${{ inputs.expected_build_id }}
