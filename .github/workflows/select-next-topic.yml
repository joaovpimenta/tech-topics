name: Select next Tech Topics article

on:
  push:
    branches: ["main"]
    paths:
      - "content/articles/*.json"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tech-topics-queue
  cancel-in-progress: false

jobs:
  select:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 21 && github.event.comment.user.login == github.repository_owner && contains(github.event.comment.body, '<!-- tech-topics:candidates:v1 -->')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out published articles
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Detect whether this push actually added an article
        id: additions
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          slugs="$(python3 tools/tts/article_selection.py --before "$BEFORE_SHA" --after "$AFTER_SHA")"
          if [ "$slugs" = '[]' ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "Only existing articles changed; no new editorial selection." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "New articles: $slugs" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up Node.js
        if: github.event_name != 'push' || steps.additions.outputs.has_new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Select one unpublished candidate
        if: github.event_name != 'push' || steps.additions.outputs.has_new == 'true'
        run: node scripts/select-next-topic.mjs --json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC_QUEUE_ISSUE_NUMBER: 21
