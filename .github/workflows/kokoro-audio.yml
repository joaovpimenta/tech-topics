name: Publish Tech Topics audio (Kokoro Dora)

on:
  workflow_call:
    inputs:
      before_sha:
        type: string
        required: false
        default: ""
      after_sha:
        type: string
        required: false
        default: ""
      slug:
        type: string
        required: false
        default: ""
      mode:
        type: string
        required: false
        default: publish
      replace_existing:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug em content/articles (exemplo: bulkhead)"
        type: string
        required: true
      mode:
        description: "Comparar amostras com Piper sem alterar Releases; ou publicar o artigo completo"
        type: choice
        required: true
        default: compare
        options:
          - compare
          - publish
      replace_existing:
        description: "Substituir MP3 existente? Apenas com mode=publish"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  select:
    name: Select article(s)
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.resolve.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Resolve article slugs
        id: resolve
        shell: bash
        env:
          INPUT_SLUG: ${{ inputs.slug }}
          BEFORE_SHA: ${{ inputs.before_sha }}
          AFTER_SHA: ${{ inputs.after_sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SLUG" ]; then
            slugs="$(python tools/tts/piper_release.py slugs --slug "$INPUT_SLUG")"
          else
            test -n "$BEFORE_SHA"
            test -n "$AFTER_SHA"
            slugs="$(python tools/tts/piper_release.py slugs --before "$BEFORE_SHA" --after "$AFTER_SHA")"
          fi
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Article selection: $slugs"

  audio:
    name: Kokoro Dora ${{ matrix.slug }} (${{ inputs.mode || 'publish' }})
    needs: select
    if: needs.select.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.select.outputs.slugs) }}
    concurrency:
      group: tech-topics-kokoro-${{ matrix.slug }}
      cancel-in-progress: false
    env:
      ARTICLE_SLUG: ${{ matrix.slug }}
      MODE: ${{ inputs.mode || 'publish' }}
      REPLACE_EXISTING: ${{ inputs.replace_existing || 'false' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4

      - name: Check publication policy
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          case "$MODE" in compare|publish) ;; *) echo "Invalid mode: $MODE" >&2; exit 1;; esac
          if [ "$MODE" = "publish" ] && [ "$REPLACE_EXISTING" != "true" ] && \
             gh release view "tts-$ARTICLE_SLUG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already published; existing release preserved."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.policy.outputs.skip != 'true'
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: .python-version

      - name: Install CPU Kokoro, G2P and audio tools
        if: steps.policy.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng libespeak-ng1 ffmpeg
          python -m pip install "kokoro-onnx==0.6.1" "misaki-fork==0.9.6" "phonemizer-fork==3.3.2" "espeakng-loader==0.2.4" "soundfile==0.13.1"
          command -v ffmpeg
          command -v ffprobe

      - name: Cache Kokoro FP32 weights and voicepack
        if: steps.policy.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-v1.0-fp32-voices-model-files-v1.1

      - name: Download model and voices only if missing
        if: steps.policy.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/kokoro
          base="https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1"
          if [ ! -s .cache/kokoro/kokoro-v1.0.onnx ]; then
            curl --fail --location --retry 3 --silent --show-error \
              "$base/kokoro-v1.0.onnx" -o .cache/kokoro/kokoro-v1.0.onnx
          fi
          if [ ! -s .cache/kokoro/voices-v1.0.bin ]; then
            curl --fail --location --retry 3 --silent --show-error \
              "$base/voices-v1.0.bin" -o .cache/kokoro/voices-v1.0.bin
          fi
          test "$(stat -c '%s' .cache/kokoro/kokoro-v1.0.onnx)" -gt 250000000
          test "$(stat -c '%s' .cache/kokoro/voices-v1.0.bin)" -gt 20000000

      - name: Prepare identical text for both engines
        if: steps.policy.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = "compare" ]; then
            python tools/tts/kokoro_release.py prepare \
              --slug "$ARTICLE_SLUG" --max-chars 1200 --output-dir .audio
          else
            python tools/tts/kokoro_release.py prepare \
              --slug "$ARTICLE_SLUG" --output-dir .audio
          fi

      - name: Synthesize in PT-BR with Kokoro Dora FP32 on CPU
        if: steps.policy.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          time python tools/tts/kokoro_release.py synthesize \
            --slug "$ARTICLE_SLUG" --output-dir .audio \
            --model .cache/kokoro/kokoro-v1.0.onnx \
            --voices .cache/kokoro/voices-v1.0.bin
          ffmpeg -hide_banner -loglevel error -y \
            -i ".audio/$ARTICLE_SLUG.wav" \
            -af "loudnorm=I=-19:TP=-1:LRA=11" \
            -ac 1 -ar 24000 -c:a libmp3lame -b:a 96k \
            ".audio/kokoro-$ARTICLE_SLUG.mp3"
          test -s ".audio/kokoro-$ARTICLE_SLUG.mp3"
          ffprobe -v error -show_entries format=duration \
            -of default=nokey=1:noprint_wrappers=1 ".audio/kokoro-$ARTICLE_SLUG.mp3"

      - name: Install Piper for A/B comparison only
        if: steps.policy.outputs.skip != 'true' && env.MODE == 'compare'
        run: python -m pip install "piper-tts==1.8.0"

      - name: Cache Piper Cadu comparison model
        if: steps.policy.outputs.skip != 'true' && env.MODE == 'compare'
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-voice-pt_BR-cadu-medium-v1

      - name: Synthesize the same sample with Piper Cadu
        if: steps.policy.outputs.skip != 'true' && env.MODE == 'compare'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/piper
          if [ ! -s .cache/piper/pt_BR-cadu-medium.onnx ]; then
            python -m piper.download_voices --data-dir .cache/piper pt_BR-cadu-medium
          fi
          start="$(date +%s)"
          python -m piper \
            --model .cache/piper/pt_BR-cadu-medium.onnx \
            --input-file ".audio/$ARTICLE_SLUG.txt" \
            --output-file ".audio/piper-$ARTICLE_SLUG.wav" \
            --sentence-silence 0.2
          end="$(date +%s)"
          ffmpeg -hide_banner -loglevel error -y \
            -i ".audio/piper-$ARTICLE_SLUG.wav" \
            -af "loudnorm=I=-19:TP=-1:LRA=11" \
            -ac 1 -ar 24000 -c:a libmp3lame -b:a 96k \
            ".audio/piper-$ARTICLE_SLUG.mp3"
          test -s ".audio/piper-$ARTICLE_SLUG.mp3"
          echo "Piper synthesis wall time: $((end-start)) seconds"
          echo "PIPER_SECONDS=$((end-start))" >> "$GITHUB_ENV"

      - name: Report objective A/B metrics
        if: steps.policy.outputs.skip != 'true' && env.MODE == 'compare'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, subprocess
          from pathlib import Path
          slug = os.environ["ARTICLE_SLUG"]
          k = json.loads((Path(".audio") / f"{slug}.metrics.json").read_text())
          wav = Path(".audio") / f"piper-{slug}.wav"
          duration = float(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1", str(wav)
          ]).decode().strip())
          piper_time = int(os.environ["PIPER_SECONDS"])
          print(f"### TTS PT-BR A/B: {slug}")
          print("A mesma amostra de texto é narrada por cada motor. Ouça os dois MP3s no artefato.")
          print("| Motor | Voz | Áudio | Tempo CPU de síntese (parede) | Fator tempo-real |")
          print("|---|---|---:|---:|---:|")
          print(f"| Kokoro FP32 | pf_dora | {k['audio_seconds']} s | {k['synthesis_seconds']} s | {k['real_time_factor']}× |")
          print(f"| Piper | pt_BR-cadu-medium | {duration:.2f} s | {piper_time} s | {piper_time/duration:.3f}× |")
          print("Comparação auditiva ainda necessária: naturalidade, inteligibilidade, sotaque e termos técnicos.")
          PY

      - name: Upload A/B MP3s for listening (no release changes)
        if: steps.policy.outputs.skip != 'true' && env.MODE == 'compare'
        uses: actions/upload-artifact@v4
        with:
          name: tts-compare-${{ matrix.slug }}-${{ github.run_id }}
          path: |
            .audio/kokoro-${{ matrix.slug }}.mp3
            .audio/piper-${{ matrix.slug }}.mp3
            .audio/${{ matrix.slug }}.txt
            .audio/${{ matrix.slug }}.metrics.json
          retention-days: 14
          if-no-files-found: error

      - name: Publish Kokoro MP3 (never overwrite by default)
        if: steps.policy.outputs.skip != 'true' && env.MODE == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          tag="tts-$ARTICLE_SLUG"
          title="$(python -c 'import json,os,pathlib;print(json.loads((pathlib.Path("content/articles") / (os.environ["ARTICLE_SLUG"] + ".json")).read_text(encoding="utf-8"))["title"])')"
          cp ".audio/kokoro-$ARTICLE_SLUG.mp3" ".audio/$ARTICLE_SLUG.mp3"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$REPLACE_EXISTING" = "true" ]; then
              gh release upload "$tag" ".audio/$ARTICLE_SLUG.mp3" --clobber
              gh release edit "$tag" --title "Tech Topics Áudio — $title" --notes-file ".audio/$ARTICLE_SLUG.md"
            else
              echo "Existing release preserved; no MP3 replaced."
            fi
          else
            gh release create "$tag" ".audio/$ARTICLE_SLUG.mp3" \
              --target "$GITHUB_SHA" \
              --title "Tech Topics Áudio — $title" \
              --notes-file ".audio/$ARTICLE_SLUG.md" --latest=false
          fi
