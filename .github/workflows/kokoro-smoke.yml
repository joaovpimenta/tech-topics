name: Verify Kokoro PT-BR and English phonemes

on:
  pull_request:
    paths:
      - ".github/workflows/kokoro-audio.yml"
      - ".github/workflows/kokoro-smoke.yml"
      - "tools/tts/kokoro_release.py"
      - "tools/tts/article_selection.py"
      - "tools/tts/test_kokoro_release.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Kokoro Dora mixed-language CPU smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng libespeak-ng1 ffmpeg
          python -m pip install "kokoro-onnx==0.6.1" "misaki-fork==0.9.6" \
            "phonemizer-fork==3.3.2" "espeakng-loader==0.2.4" "soundfile==0.13.1"
      - name: Reuse FP32 ONNX weights
        uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-v1.0-fp32-voices-model-files-v1.1
      - name: Download weights if absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/kokoro
          base="https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1"
          for file in kokoro-v1.0.onnx voices-v1.0.bin; do
            if [ ! -s ".cache/kokoro/$file" ]; then
              curl --fail --location --retry 3 --silent --show-error \
                "$base/$file" -o ".cache/kokoro/$file"
            fi
          done
      - name: Prepare Bulkhead with HTML en-US spans
        run: python tools/tts/kokoro_release.py prepare --slug bulkhead --max-chars 1500 --output-dir .audio
      - name: Verify English segments survive extraction
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path(".audio/bulkhead.segments.json").read_text(encoding="utf-8"))
          mixed = [s for s in data if {"en-us", "pt-br"} <= {r["lang"] for r in s["runs"]}]
          words = [r["text"].strip() for s in data for r in s["runs"] if r["lang"] == "en-us"]
          assert mixed, "No mixed-language segment preserved"
          assert any("bulkhead" in w.lower() for w in words), words
          print("English spans:", words[:12])
          print("Mixed-language segments:", len(mixed))
          PY
      - name: Synthesize with Dora and both G2P languages
        run: |
          python tools/tts/kokoro_release.py synthesize \
            --slug bulkhead --output-dir .audio \
            --model .cache/kokoro/kokoro-v1.0.onnx \
            --voices .cache/kokoro/voices-v1.0.bin
          ffmpeg -hide_banner -loglevel error -y -i .audio/bulkhead.wav \
            -af "loudnorm=I=-19:TP=-1:LRA=11" -ar 24000 -ac 1 \
            -c:a libmp3lame -b:a 96k .audio/bulkhead-mixed-preview.mp3
          test -s .audio/bulkhead-mixed-preview.mp3
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path(".audio/bulkhead.metrics.json").read_text(encoding="utf-8"))
          assert m["english_runs"] > 0, m
          assert any("bulkhead" in e["text"].lower() for e in m["english_examples"]), m
          print(m)
          PY
      - name: Upload preview and phoneme metrics
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-bulkhead-mixed-${{ github.run_id }}
          path: |
            .audio/bulkhead-mixed-preview.mp3
            .audio/bulkhead.segments.json
            .audio/bulkhead.metrics.json
          retention-days: 14
          if-no-files-found: error
