# One-time repair of the two missing v2 MP3 Releases.
# Adding this workflow to main triggers it once; removing it later
# does NOT trigger it again. No other TTS synthesis is authorized.
name: Retry two missing Kokoro Releases (one-off)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tts-retry-failed-once.yml"

permissions:
  contents: write

jobs:
  publish-only-the-two-missing:
    name: Retry ${{ matrix.slug }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slug:
          - github-governance-as-code
          - retries-backoff-jitter
    uses: ./.github/workflows/kokoro-audio.yml
    with:
      article: ${{ matrix.slug }}
      mode: publish
      replace_existing: false
      all_articles: false
      retry_failed_only: true
    permissions:
      contents: write
