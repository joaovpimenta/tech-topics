<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="title desc"><title id="title">A janela que produz duplicatas</title><desc id="desc">Etapa 1: evento persistido. Etapa 2: broker aceita. Etapa 3: relay cai antes de marcar envio. Etapa 4: reinício publica o mesmo identificador. Consumidor deduplica.</desc><rect width="360" height="520" rx="8" fill="#f6f5f0"/><g font-family="Arial, sans-serif" font-size="15" fill="#252525"><text x="180" y="28" font-size="16" text-anchor="middle" fill="#252525">Aceito no broker, pendente no banco</text><rect x="20" y="47" width="320" height="62" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="180.0" y="74" font-size="16" text-anchor="middle" fill="#252525">1. Evento E-42 confirmado</text><text x="180.0" y="96" font-size="13" text-anchor="middle" fill="#252525">Outbox: pendente</text><path d="M180 109 V133" stroke="#252525" stroke-width="2"/><path d="M175 131 L180 140 L185 131" fill="none" stroke="#252525" stroke-width="2"/><rect x="20" y="143" width="320" height="62" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="180.0" y="170" font-size="16" text-anchor="middle" fill="#252525">2. Broker aceita E-42</text><text x="180.0" y="192" font-size="13" text-anchor="middle" fill="#252525">A confirmação chega ao relay</text><path d="M180 205 V229" stroke="#252525" stroke-width="2"/><path d="M175 227 L180 236 L185 227" fill="none" stroke="#252525" stroke-width="2"/><rect x="20" y="239" width="320" height="62" rx="6" fill="#fff" stroke="#9a542b" stroke-width="2"/><text x="180.0" y="266" font-size="16" text-anchor="middle" fill="#252525">3. Falha antes de marcar envio</text><text x="180.0" y="288" font-size="13" text-anchor="middle" fill="#252525">Outbox ainda diz: pendente</text><path d="M180 301 V325" stroke="#252525" stroke-width="2"/><path d="M175 323 L180 332 L185 323" fill="none" stroke="#252525" stroke-width="2"/><rect x="20" y="335" width="320" height="62" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="180.0" y="362" font-size="16" text-anchor="middle" fill="#252525">4. Reinício reenvia E-42</text><text x="180.0" y="384" font-size="13" text-anchor="middle" fill="#252525">Duas entregas, o mesmo ID</text><path d="M180 397 V421" stroke="#252525" stroke-width="2"/><path d="M175 419 L180 428 L185 419" fill="none" stroke="#252525" stroke-width="2"/><rect x="20" y="431" width="320" height="62" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="180.0" y="458" font-size="16" text-anchor="middle" fill="#252525">5. Inbox reconhece E-42</text><text x="180.0" y="480" font-size="13" text-anchor="middle" fill="#252525">O efeito é aplicado uma vez</text></g></svg>