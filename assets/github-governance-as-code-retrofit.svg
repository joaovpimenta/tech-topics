<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="t d"><title id="t">Fluxo de retrofit histórico</title><desc id="d">Issues abertas e fechadas passam por leitura, classificação segura, triagem quando ambíguas, normalização e espelhamento no Project.</desc><rect width="1100" height="500" rx="24" fill="#f5f1e8"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f514e"/></marker></defs><g font-family="system-ui, sans-serif" fill="#24292f"><rect x="45" y="170" width="170" height="100" rx="16" fill="#dce6e9" stroke="#6e8e9b" stroke-width="3"/><text x="130" y="210" text-anchor="middle" font-size="20" font-weight="700">Histórico</text><text x="130" y="242" text-anchor="middle" font-size="16">open + closed</text><rect x="280" y="170" width="190" height="100" rx="16" fill="#e7dfcf" stroke="#c3a87d" stroke-width="3"/><text x="375" y="210" text-anchor="middle" font-size="20" font-weight="700">Interpretar</text><text x="375" y="242" text-anchor="middle" font-size="16">labels + body + estado</text><polygon points="555,150 660,220 555,290 450,220" fill="#fff" stroke="#4f514e" stroke-width="3"/><text x="555" y="211" text-anchor="middle" font-size="17" font-weight="700">classificação</text><text x="555" y="236" text-anchor="middle" font-size="17" font-weight="700">inequívoca?</text><rect x="735" y="75" width="220" height="100" rx="16" fill="#e1e8d7" stroke="#83936c" stroke-width="3"/><text x="845" y="115" text-anchor="middle" font-size="20" font-weight="700">Normalizar</text><text x="845" y="147" text-anchor="middle" font-size="16">Type + Areas + relações</text><rect x="735" y="315" width="220" height="100" rx="16" fill="#ead9d2" stroke="#b56d4f" stroke-width="3"/><text x="845" y="355" text-anchor="middle" font-size="20" font-weight="700">Needs triage</text><text x="845" y="387" text-anchor="middle" font-size="16">não inventar metadado</text><rect x="930" y="190" width="135" height="100" rx="16" fill="#dde3e6" stroke="#4f514e" stroke-width="3"/><text x="997" y="230" text-anchor="middle" font-size="19" font-weight="700">Project</text><text x="997" y="258" text-anchor="middle" font-size="15">espelhar campos</text></g><g fill="none" stroke="#4f514e" stroke-width="4" marker-end="url(#a)"><path d="M215 220H280"/><path d="M470 220H450"/><path d="M630 185C670 150 695 125 735 125"/><path d="M630 255C675 305 695 365 735 365"/><path d="M955 125C1000 125 1000 170 997 190"/><path d="M955 365C1005 365 1005 315 997 290"/></g><text x="668" y="145" font-family="system-ui, sans-serif" font-size="16" fill="#1f883d">sim</text><text x="668" y="305" font-family="system-ui, sans-serif" font-size="16" fill="#d1242f">não</text></svg>