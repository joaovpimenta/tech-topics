<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" role="img" aria-labelledby="title desc">
  <title id="title">Escrita confirmada e duas leituras possíveis</title>
  <desc id="desc">Uma escrita da versão 2 é confirmada por A, B e C. Uma leitura fraca apenas em E retorna a versão antiga 1. Uma leitura de três réplicas C, D e E inclui C e escolhe a versão 2.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277d69"/></marker></defs>
  <rect width="940" height="600" rx="22" fill="#f5f8f6"/>
  <g font-family="Arial,sans-serif" fill="#253a34">
    <text x="32" y="42" font-size="23" font-weight="700">Mesmo estado, contratos de leitura diferentes</text>
    <text x="32" y="76" font-size="16">Exemplo didático com N = 5 e escrita confirmada por W = 3.</text>
    <g stroke="#b8c7c0" stroke-width="2"><path d="M210 110V552"/><path d="M350 110V552"/><path d="M490 110V552"/><path d="M630 110V552"/><path d="M770 110V552"/></g>
    <g text-anchor="middle" font-size="20" font-weight="700"><text x="210" y="105">A</text><text x="350" y="105">B</text><text x="490" y="105">C</text><text x="630" y="105">D</text><text x="770" y="105">E</text></g>
    <text x="30" y="153" font-size="18" font-weight="700">1 · PUT v2</text>
    <g stroke="#277d69" stroke-width="3" marker-end="url(#arrow)"><path d="M120 175H202"/><path d="M120 210H342"/><path d="M120 245H482"/></g>
    <g font-size="15"><text x="220" y="170">grava v2</text><text x="360" y="205">grava v2</text><text x="500" y="240">grava v2</text></g>
    <rect x="28" y="275" width="884" height="54" rx="10" fill="#d8eadf"/><text x="48" y="308" font-size="18"><tspan font-weight="700">ACK ao cliente:</tspan> três confirmações; D e E ainda guardam v1.</text>
    <text x="30" y="374" font-size="18" font-weight="700">2A · GET R = 1 em E</text>
    <path d="M120 398H762" stroke="#9b6a24" stroke-width="3" marker-end="url(#arrow)"/><path d="M770 420H128" stroke="#9b6a24" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="28" y="438" width="400" height="55" rx="10" fill="#f1dfbd"/><text x="48" y="472" font-size="18">Resultado possível: <tspan font-weight="700">v1 obsoleta</tspan></text>
    <text x="475" y="374" font-size="18" font-weight="700">2B · GET R = 3 em C, D e E</text>
    <path d="M570 398H498" stroke="#277d69" stroke-width="3" marker-end="url(#arrow)"/><path d="M570 412H622" stroke="#277d69" stroke-width="3" marker-end="url(#arrow)"/><path d="M570 426H762" stroke="#277d69" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="475" y="438" width="437" height="55" rx="10" fill="#d8eadf"/><text x="495" y="472" font-size="18">Conjunto contém C; versão escolhida: <tspan font-weight="700">v2</tspan></text>
    <text x="30" y="545" font-size="16" fill="#52645e">O passo “escolher v2” exige metadados e regra de reconciliação corretos; a interseção sozinha não os fornece.</text>
  </g>
</svg>
