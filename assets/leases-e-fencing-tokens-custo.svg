<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">Custo calculado de renovações por intervalo</title>
  <desc id="desc">Gráfico de barras para dez mil leases. Renovar a cada cinco segundos exige duas mil renovações por segundo; a cada dez, mil; a cada vinte, quinhentas; a cada sessenta, aproximadamente cento e sessenta e sete.</desc>
  <rect width="820" height="500" rx="14" fill="#f5f8f6"/>
  <g font-family="Arial,sans-serif" fill="#252525">
    <text x="30" y="42" font-size="22" font-weight="700">10.000 leases · R = N / intervalo</text>
    <text x="30" y="76" font-size="15" fill="#666">Valores calculados; não são benchmark.</text>
    <path d="M105 105V405H775" stroke="#6f7772" stroke-width="2"/>
    <g font-size="14" fill="#666" text-anchor="end"><text x="94" y="410">0</text><text x="94" y="335">500</text><text x="94" y="260">1.000</text><text x="94" y="185">1.500</text><text x="94" y="110">2.000</text></g>
    <g stroke="#d4dad6"><path d="M105 330H775"/><path d="M105 255H775"/><path d="M105 180H775"/><path d="M105 105H775"/></g>
    <g fill="#277d69"><rect x="155" y="105" width="100" height="300" rx="4"/><rect x="315" y="255" width="100" height="150" rx="4"/><rect x="475" y="330" width="100" height="75" rx="4"/><rect x="635" y="380" width="100" height="25" rx="4"/></g>
    <g font-size="15" text-anchor="middle"><text x="205" y="430">5 s</text><text x="365" y="430">10 s</text><text x="525" y="430">20 s</text><text x="685" y="430">60 s</text><text x="205" y="96">2.000/s</text><text x="365" y="246">1.000/s</text><text x="525" y="321">500/s</text><text x="685" y="371">≈167/s</text></g>
    <text x="440" y="470" font-size="15" text-anchor="middle">Intervalo entre renovações (segundos)</text>
    <text x="25" y="270" font-size="15" transform="rotate(-90 25 270)" text-anchor="middle">Renovações por segundo</text>
  </g>
</svg>
