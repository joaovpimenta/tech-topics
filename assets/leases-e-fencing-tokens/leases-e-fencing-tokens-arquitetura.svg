<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura de lease com fencing token</title>
  <desc id="desc">Dois workers disputam uma lease em um serviço de coordenação consistente. Cada aquisição recebe um token crescente. O recurso protegido guarda o maior token aceito e rejeita tokens menores.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277d69"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9b4b2b"/></marker></defs>
  <rect width="820" height="500" rx="14" fill="#f5f8f6"/>
  <g font-family="Arial,sans-serif" fill="#252525">
    <text x="30" y="42" font-size="22" font-weight="700">Autoridade temporária + ordem verificável</text>
    <g fill="#fff" stroke="#277d69" stroke-width="2"><rect x="35" y="105" width="190" height="92" rx="8"/><rect x="35" y="300" width="190" height="92" rx="8"/><rect x="310" y="185" width="205" height="122" rx="8"/><rect x="615" y="185" width="170" height="122" rx="8"/></g>
    <g text-anchor="middle"><text x="130" y="140" font-size="19" font-weight="700">Worker A</text><text x="130" y="170" font-size="16">cliente potencial</text><text x="130" y="335" font-size="19" font-weight="700">Worker B</text><text x="130" y="365" font-size="16">cliente potencial</text><text x="412" y="222" font-size="19" font-weight="700">Coordenação</text><text x="412" y="251" font-size="16">estado linearizável</text><text x="412" y="278" font-size="16">token monotônico</text><text x="700" y="222" font-size="19" font-weight="700">Recurso</text><text x="700" y="251" font-size="16">max_token</text><text x="700" y="278" font-size="16">e efeito atômico</text></g>
    <path d="M225 151L304 215" stroke="#277d69" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M225 346L304 278" stroke="#277d69" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M515 225H608" stroke="#277d69" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="560" y="210" font-size="14" text-anchor="middle">write(token, op)</text>
    <path d="M615 284H522" stroke="#9b4b2b" stroke-width="2" fill="none" marker-end="url(#r)"/><text x="565" y="326" font-size="14" text-anchor="middle" fill="#8b4423">aceita t ≥ max; rejeita t &lt; max</text>
    <text x="30" y="443" font-size="16">O coordenador decide quem recebe a próxima geração.</text>
    <text x="30" y="471" font-size="16">O recurso — não o cliente — fecha a janela entre “verificar” e “agir”.</text>
  </g>
</svg>
