<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="t d"><title id="t">Separação de responsabilidades entre metadados</title><desc id="d">Campos de classificação, planejamento, identidade derivada e relacionamento são separados para evitar duplicação e conflito.</desc><rect width="1100" height="520" rx="24" fill="#f5f1e8"/><g font-family="system-ui, sans-serif" fill="#24292f"><text x="550" y="58" text-anchor="middle" font-size="27" font-weight="700">Cada dimensão responde a uma pergunta</text><rect x="55" y="105" width="235" height="300" rx="18" fill="#dce6e9" stroke="#6e8e9b" stroke-width="3"/><text x="172" y="148" text-anchor="middle" font-size="22" font-weight="700">Classificação</text><text x="172" y="195" text-anchor="middle" font-size="19">Type</text><text x="172" y="229" text-anchor="middle" font-size="19">Area</text><text x="172" y="276" text-anchor="middle" font-size="16">labels no repo</text><text x="172" y="306" text-anchor="middle" font-size="16">espelhados no Project</text><rect x="325" y="105" width="235" height="300" rx="18" fill="#e1e8d7" stroke="#83936c" stroke-width="3"/><text x="442" y="148" text-anchor="middle" font-size="22" font-weight="700">Planejamento</text><text x="442" y="195" text-anchor="middle" font-size="19">Status</text><text x="442" y="229" text-anchor="middle" font-size="19">Priority</text><text x="442" y="276" text-anchor="middle" font-size="16">campos do Project</text><text x="442" y="306" text-anchor="middle" font-size="16">sem label duplicada</text><rect x="595" y="105" width="235" height="300" rx="18" fill="#e7dfcf" stroke="#c3a87d" stroke-width="3"/><text x="712" y="148" text-anchor="middle" font-size="22" font-weight="700">Identidade</text><text x="712" y="195" text-anchor="middle" font-size="19">Organization</text><text x="712" y="229" text-anchor="middle" font-size="19">Product</text><text x="712" y="263" text-anchor="middle" font-size="19">Repository</text><text x="712" y="306" text-anchor="middle" font-size="16">derivados automaticamente</text><rect x="865" y="105" width="180" height="300" rx="18" fill="#ead9d2" stroke="#b56d4f" stroke-width="3"/><text x="955" y="148" text-anchor="middle" font-size="22" font-weight="700">Relações</text><text x="955" y="195" text-anchor="middle" font-size="18">blocked by</text><text x="955" y="229" text-anchor="middle" font-size="18">blocking</text><text x="955" y="263" text-anchor="middle" font-size="18">sub-issues</text><text x="955" y="306" text-anchor="middle" font-size="16">recursos nativos</text></g><path d="M75 450H1025" stroke="#8c959f" stroke-width="2" stroke-dasharray="8 10"/><text x="550" y="482" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#57606a">Evite representar a mesma verdade em dois lugares que podem divergir.</text></svg>