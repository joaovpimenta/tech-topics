<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Distribuição uniforme de chaves não impede um ponto quente de tráfego</title>
  <desc id="desc">Quatro nós guardam 25 por cento das chaves cada, mas o nó B recebe 70 por cento das requisições porque contém uma chave muito popular.</desc>
  <defs><pattern id="qps" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#b8783f"/><rect width="3" height="10" fill="#8f432f"/></pattern></defs>
  <rect width="900" height="560" rx="24" fill="#f5f8f6"/>
  <text x="48" y="56" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#213c35">Chaves equilibradas, tráfego desequilibrado</text>
  <text x="48" y="84" font-family="Arial,sans-serif" font-size="15" fill="#596b66">Cenário ilustrativo: uma única chave popular está no nó B</text>
  <g stroke="#c7d1cd"><path d="M125 430H840"/><path d="M125 330H840"/><path d="M125 230H840"/><path d="M125 130H840"/></g>
  <g font-family="Arial,sans-serif" font-size="14" fill="#596b66" text-anchor="end"><text x="112" y="435">0%</text><text x="112" y="335">25%</text><text x="112" y="235">50%</text><text x="112" y="135">75%</text></g>
  <text x="30" y="300" transform="rotate(-90 30 300)" font-family="Arial,sans-serif" font-size="15" fill="#213c35">Participação no total (%)</text>
  <g><rect x="185" y="330" width="52" height="100" fill="#247d6b"/><rect x="240" y="390" width="52" height="40" fill="url(#qps)"/><rect x="355" y="330" width="52" height="100" fill="#247d6b"/><rect x="410" y="150" width="52" height="280" fill="url(#qps)"/><rect x="525" y="330" width="52" height="100" fill="#247d6b"/><rect x="580" y="390" width="52" height="40" fill="url(#qps)"/><rect x="695" y="330" width="52" height="100" fill="#247d6b"/><rect x="750" y="390" width="52" height="40" fill="url(#qps)"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#213c35"><text x="238" y="466" font-size="18" font-weight="700">A</text><text x="408" y="466" font-size="18" font-weight="700">B</text><text x="578" y="466" font-size="18" font-weight="700">C</text><text x="748" y="466" font-size="18" font-weight="700">D</text><text x="436" y="137" font-size="17" font-weight="700" fill="#8f432f">70% das requisições</text></g>
  <g font-family="Arial,sans-serif" font-size="14" fill="#213c35"><rect x="240" y="505" width="22" height="16" fill="#247d6b"/><text x="270" y="519">chaves armazenadas</text><rect x="470" y="505" width="22" height="16" fill="url(#qps)"/><text x="500" y="519">requisições por segundo</text></g>
</svg>
