<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
  <title id="title">Amplificação combinatória de retries em três camadas</title>
  <desc id="desc">Uma ação chega ao frontend. Se frontend, backend e cliente do banco permitem quatro tentativas cada, o pior caso produz 1, 4, 16 e 64 operações nos níveis sucessivos.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277d69"/></marker></defs>
  <rect width="880" height="500" rx="22" fill="#f5f8f6"/>
  <g font-family="Arial,sans-serif" fill="#243a34">
    <text x="40" y="44" font-size="23" font-weight="700">Retries em todas as camadas multiplicam trabalho</text>
    <text x="40" y="75" font-size="16">Pior caso ilustrativo: 3 retries = 4 tentativas por camada</text>
    <g text-anchor="middle">
      <rect x="38" y="150" width="160" height="112" rx="12" fill="#fff" stroke="#277d69" stroke-width="3"/><text x="118" y="185" font-size="18" font-weight="700">Ação do usuário</text><text x="118" y="230" font-size="38" font-weight="700">1</text>
      <rect x="252" y="150" width="160" height="112" rx="12" fill="#e2eee8" stroke="#277d69" stroke-width="3"/><text x="332" y="185" font-size="18" font-weight="700">Frontend</text><text x="332" y="230" font-size="38" font-weight="700">4</text>
      <rect x="466" y="150" width="160" height="112" rx="12" fill="#d2e6dc" stroke="#277d69" stroke-width="3"/><text x="546" y="185" font-size="18" font-weight="700">Backend</text><text x="546" y="230" font-size="38" font-weight="700">16</text>
      <rect x="680" y="150" width="160" height="112" rx="12" fill="#f0dfbd" stroke="#9b6a24" stroke-width="3"/><text x="760" y="185" font-size="18" font-weight="700">Banco</text><text x="760" y="230" font-size="38" font-weight="700">64</text>
    </g>
    <g fill="none" stroke="#277d69" stroke-width="3" marker-end="url(#arrow)"><path d="M198 206H245"/><path d="M412 206H459"/><path d="M626 206H673"/></g>
    <g text-anchor="middle" font-size="16" fill="#52645e"><text x="225" y="194">×4</text><text x="439" y="194">×4</text><text x="653" y="194">×4</text></g>
    <rect x="80" y="330" width="720" height="105" rx="12" fill="#fff" stroke="#c3d3cc" stroke-width="2"/>
    <text x="440" y="369" text-anchor="middle" font-size="20" font-weight="700">1 × 4 × 4 × 4 = 64 tentativas no banco</text>
    <text x="440" y="402" text-anchor="middle" font-size="16">A falha original está no destino que recebe a maior amplificação.</text>
    <text x="440" y="425" text-anchor="middle" font-size="16">Centralize a política: normalmente só a camada imediatamente acima repete.</text>
  </g>
</svg>
