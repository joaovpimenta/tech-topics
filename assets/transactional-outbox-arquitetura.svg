<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 510" role="img" aria-labelledby="title desc"><title id="title">Uma transação local, entrega assíncrona</title><desc id="desc">O serviço grava pedido e evento dentro da mesma transação. Após o commit, um relay lê o evento, publica no broker e o consumidor aplica seu efeito.</desc><rect width="360" height="510" rx="8" fill="#f6f5f0"/><g font-family="Arial, sans-serif" font-size="15" fill="#252525"><text x="180" y="28" font-size="17" text-anchor="middle" fill="#252525">O limite atômico fica no banco</text><rect x="65" y="48" width="230" height="60" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="180.0" y="75" font-size="16" text-anchor="middle" fill="#252525">Serviço de pedidos</text><text x="180.0" y="97" font-size="13" text-anchor="middle" fill="#252525">1. recebe o comando</text><path d="M180 108 V132" stroke="#252525" stroke-width="2"/><path d="M175 130 L180 139 L185 130" fill="none" stroke="#252525" stroke-width="2"/><rect x="20" y="142" width="320" height="152" rx="8" fill="#e8f2ee" stroke="#277d69" stroke-width="2" stroke-dasharray="6 4"/><text x="180" y="168" font-size="16" text-anchor="middle" fill="#252525">2. mesma transação local</text><rect x="38" y="187" width="132" height="67" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="104.0" y="214" font-size="16" text-anchor="middle" fill="#252525">Pedido</text><text x="104.0" y="236" font-size="13" text-anchor="middle" fill="#252525">estado de negócio</text><rect x="190" y="187" width="132" height="67" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="256.0" y="214" font-size="16" text-anchor="middle" fill="#252525">Outbox</text><text x="256.0" y="236" font-size="13" text-anchor="middle" fill="#252525">evento durável</text><text x="180" y="279" font-size="14" text-anchor="middle" fill="#252525">COMMIT: ambos ou nenhum</text><path d="M180 294 V320" stroke="#252525" stroke-width="2"/><path d="M175 318 L180 327 L185 318" fill="none" stroke="#252525" stroke-width="2"/><rect x="65" y="330" width="230" height="60" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="180.0" y="357" font-size="16" text-anchor="middle" fill="#252525">Relay</text><text x="180.0" y="379" font-size="13" text-anchor="middle" fill="#252525">3. lê somente commits</text><path d="M180 390 V415" stroke="#252525" stroke-width="2"/><path d="M175 413 L180 422 L185 413" fill="none" stroke="#252525" stroke-width="2"/><rect x="65" y="425" width="230" height="60" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="180.0" y="452" font-size="16" text-anchor="middle" fill="#252525">Broker → consumidor</text><text x="180.0" y="474" font-size="13" text-anchor="middle" fill="#252525">4. entrega e efeito local</text></g></svg>