<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 600" role="img" aria-labelledby="title desc">
<title id="title">Governança de projetos no GitHub</title>
<desc id="desc">Cena editorial em aquarela com uma mesa central distribuindo pastas padronizadas para três estações de trabalho, destacada por círculos e uma seta preta tracejada.</desc>
<defs>
 <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="4" seed="71" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
 <filter id="wc" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".012 .025" numOctaves="2" seed="74" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/><feGaussianBlur stdDeviation=".35"/></filter>
 <filter id="ink" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/><feComponentTransfer in="b" result="s"><feFuncA type="linear" slope=".32"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1560" height="600" fill="#f5f1e8"/><rect width="1560" height="600" filter="url(#paper)" opacity=".6"/>
<g filter="url(#wc)" opacity=".96">
