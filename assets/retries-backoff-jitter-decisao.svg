<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de decisão antes de repetir uma operação</title>
  <desc id="desc">Após uma falha, classificar se é transitória, confirmar segurança da repetição, verificar deadline e orçamento, respeitar orientação do servidor e então aguardar um backoff com jitter. Qualquer resposta negativa encerra com falha controlada.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277d69"/></marker></defs>
  <rect width="900" height="720" rx="22" fill="#f5f8f6"/>
  <g font-family="Arial,sans-serif" fill="#243a34">
    <text x="42" y="44" font-size="23" font-weight="700">Retry é uma decisão, não um laço automático</text>
    <g text-anchor="middle">
      <rect x="335" y="76" width="230" height="58" rx="29" fill="#173b32"/><text x="450" y="112" font-size="19" fill="#fff" font-weight="700">Tentativa falhou</text>
      <path d="M450 134V166" stroke="#277d69" stroke-width="3" marker-end="url(#arrow)"/>
      <polygon points="450,168 610,220 450,272 290,220" fill="#fff" stroke="#277d69" stroke-width="3"/><text x="450" y="215" font-size="18" font-weight="700">Falha é transitória</text><text x="450" y="238" font-size="18" font-weight="700">e explicitamente retryable?</text>
      <path d="M450 272V304" stroke="#277d69" stroke-width="3" marker-end="url(#arrow)"/><text x="470" y="294" font-size="15" fill="#277d69">sim</text>
      <polygon points="450,306 610,358 450,410 290,358" fill="#fff" stroke="#277d69" stroke-width="3"/><text x="450" y="353" font-size="18" font-weight="700">Repetição é segura?</text><text x="450" y="376" font-size="16">idempotente, chave ou “não aplicado”</text>
      <path d="M450 410V442" stroke="#277d69" stroke-width="3" marker-end="url(#arrow)"/><text x="470" y="432" font-size="15" fill="#277d69">sim</text>
      <polygon points="450,444 610,496 450,548 290,496" fill="#fff" stroke="#277d69" stroke-width="3"/><text x="450" y="491" font-size="18" font-weight="700">Há deadline e</text><text x="450" y="514" font-size="18" font-weight="700">retry budget restantes?</text>
      <path d="M450 548V580" stroke="#277d69" stroke-width="3" marker-end="url(#arrow)"/><text x="470" y="570" font-size="15" fill="#277d69">sim</text>
      <rect x="270" y="582" width="360" height="72" rx="12" fill="#d8eadf" stroke="#277d69" stroke-width="3"/><text x="450" y="611" font-size="17" font-weight="700">Respeitar Retry-After / pushback</text><text x="450" y="636" font-size="17">esperar backoff com jitter e tentar</text>
      <rect x="675" y="326" width="180" height="72" rx="12" fill="#f0dfbd" stroke="#9b6a24" stroke-width="3"/><text x="765" y="356" font-size="17" font-weight="700">Falhar agora</text><text x="765" y="380" font-size="15">propagar ou degradar</text>
    </g>
    <g fill="none" stroke="#9b6a24" stroke-width="3" marker-end="url(#arrow)"><path d="M610 220H765V318"/><path d="M610 358H668"/><path d="M610 496H765V405"/></g>
    <g font-size="15" fill="#8a5b20"><text x="628" y="211">não</text><text x="628" y="348">não</text><text x="628" y="487">não</text></g>
    <text x="450" y="687" text-anchor="middle" font-size="16" fill="#52645e">Cancelar trabalho vencido; uma resposta tardia não devolve o tempo ao usuário.</text>
  </g>
</svg>
