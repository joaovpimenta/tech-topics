<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img" aria-labelledby="title desc"><title id="title">Ordem por agregado não é ordem global</title><desc id="desc">Pedido A tem eventos versão 1 e versão 2 serializados na partição A. Pedido B tem seus próprios eventos serializados na partição B. Não há ordenação global entre A e B.</desc><rect width="360" height="430" rx="8" fill="#f6f5f0"/><g font-family="Arial, sans-serif" font-size="15" fill="#252525"><text x="180" y="29" font-size="17" text-anchor="middle" fill="#252525">Cada pedido tem sua sequência</text><text x="95" y="64" font-size="16" text-anchor="middle" fill="#252525">Pedido A</text><text x="265" y="64" font-size="16" text-anchor="middle" fill="#252525">Pedido B</text><rect x="20" y="82" width="150" height="60" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="95.0" y="109" font-size="16" text-anchor="middle" fill="#252525">A · versão 1</text><text x="95.0" y="131" font-size="13" text-anchor="middle" fill="#252525">chave: A</text><rect x="190" y="82" width="150" height="60" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="265.0" y="109" font-size="16" text-anchor="middle" fill="#252525">B · versão 1</text><text x="265.0" y="131" font-size="13" text-anchor="middle" fill="#252525">chave: B</text><path d="M95 142 V170" stroke="#252525" stroke-width="2"/><path d="M90 168 L95 177 L100 168" fill="none" stroke="#252525" stroke-width="2"/><path d="M265 142 V170" stroke="#252525" stroke-width="2"/><path d="M260 168 L265 177 L270 168" fill="none" stroke="#252525" stroke-width="2"/><rect x="20" y="180" width="150" height="60" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="95.0" y="207" font-size="16" text-anchor="middle" fill="#252525">A · versão 2</text><text x="95.0" y="229" font-size="13" text-anchor="middle" fill="#252525">chave: A</text><rect x="190" y="180" width="150" height="60" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="265.0" y="207" font-size="16" text-anchor="middle" fill="#252525">B · versão 2</text><text x="265.0" y="229" font-size="13" text-anchor="middle" fill="#252525">chave: B</text><path d="M95 240 V268" stroke="#252525" stroke-width="2"/><path d="M90 266 L95 275 L100 266" fill="none" stroke="#252525" stroke-width="2"/><path d="M265 240 V268" stroke="#252525" stroke-width="2"/><path d="M260 266 L265 275 L270 266" fill="none" stroke="#252525" stroke-width="2"/><rect x="20" y="278" width="150" height="60" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="95.0" y="305" font-size="16" text-anchor="middle" fill="#252525">Partição α</text><text x="95.0" y="327" font-size="13" text-anchor="middle" fill="#252525">ordem de A</text><rect x="190" y="278" width="150" height="60" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="265.0" y="305" font-size="16" text-anchor="middle" fill="#252525">Partição β</text><text x="265.0" y="327" font-size="13" text-anchor="middle" fill="#252525">ordem de B</text><text x="180" y="377" font-size="15" text-anchor="middle" fill="#252525">A1 antes de A2; B1 antes de B2</text><text x="180" y="402" font-size="14" text-anchor="middle" fill="#252525">A2 versus B1: sem ordem global</text></g></svg>