<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
  <title id="title">Uma pausa transforma o antigo dono em cliente obsoleto</title>
  <desc id="desc">Linha do tempo calculada de zero a quarenta segundos. O worker A recebe token 41 e pausa. Sua lease expira aos vinte segundos. B recebe token 42 e grava aos vinte e seis. A retorna aos trinta e dois; sem fencing sua escrita atrasada seria aceita.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277d69"/></marker></defs>
  <rect width="820" height="520" rx="14" fill="#f5f8f6"/>
  <g font-family="Arial,sans-serif" fill="#252525">
    <text x="30" y="40" font-size="22" font-weight="700">Lease de 20 s · pausa maior que o prazo</text>
    <text x="30" y="78" font-size="15" fill="#666">Tempo desde a aquisição (s)</text>
    <path d="M130 102H775" stroke="#aeb9b2" stroke-width="2" marker-end="url(#arrow)"/>
    <g font-size="14" fill="#666" text-anchor="middle"><text x="130" y="94">0</text><text x="291" y="94">10</text><text x="452" y="94">20</text><text x="613" y="94">30</text><text x="774" y="94">40</text></g>
    <g stroke="#d4dad6"><path d="M130 103V465"/><path d="M291 103V465"/><path d="M452 103V465"/><path d="M613 103V465"/><path d="M774 103V465"/></g>
    <text x="30" y="155" font-size="18" font-weight="700">Worker A</text>
    <rect x="130" y="132" width="129" height="42" rx="6" fill="#277d69"/><text x="194" y="158" font-size="15" fill="#fff" text-anchor="middle">token 41</text>
    <rect x="259" y="132" width="354" height="42" rx="6" fill="#c8cec9"/><text x="436" y="158" font-size="15" text-anchor="middle">pausa do processo</text>
    <rect x="613" y="132" width="112" height="42" rx="6" fill="#9b4b2b"/><text x="669" y="158" font-size="15" fill="#fff" text-anchor="middle">retorna</text>
    <path d="M452 118V438" stroke="#9b4b2b" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="460" y="205" font-size="14" fill="#8b4423">lease A expira</text>
    <text x="30" y="270" font-size="18" font-weight="700">Worker B</text>
    <rect x="484" y="247" width="177" height="42" rx="6" fill="#277d69"/><text x="572" y="273" font-size="15" fill="#fff" text-anchor="middle">token 42 · grava</text>
    <text x="30" y="373" font-size="18" font-weight="700">Recurso</text>
    <rect x="536" y="344" width="177" height="42" rx="6" fill="#fff" stroke="#277d69" stroke-width="2"/><text x="624" y="370" font-size="15" text-anchor="middle">último token = 42</text>
    <path d="M661 289L661 338" stroke="#277d69" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M725 174L725 338" stroke="#9b4b2b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="598" y="424" font-size="16" fill="#8b4423">A ainda pode enviar uma escrita atrasada.</text>
    <text x="598" y="450" font-size="16" fill="#8b4423">O timeout não apaga processos nem pacotes.</text>
    <g font-size="14"><rect x="30" y="482" width="18" height="12" fill="#277d69"/><text x="57" y="493">autoridade vigente</text><rect x="220" y="482" width="18" height="12" fill="#9b4b2b"/><text x="247" y="493">ação obsoleta</text><rect x="385" y="482" width="18" height="12" fill="#c8cec9"/><text x="412" y="493">processo sem progresso</text></g>
  </g>
</svg>
