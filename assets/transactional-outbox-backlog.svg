<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" role="img" aria-labelledby="title desc"><title id="title">Backlog calculado em uma indisponibilidade</title><desc id="desc">Com entrada de 200 eventos por segundo e saída zero por 60 segundos, a fila cresce de zero a 12000 eventos. Com saída de 500 eventos por segundo, mantendo a entrada, a fila esvazia em 40 segundos, aos 100 segundos desde a falha.</desc><rect width="360" height="490" rx="8" fill="#f6f5f0"/><g font-family="Arial, sans-serif" font-size="15" fill="#252525"><text x="180" y="28" font-size="17" text-anchor="middle" fill="#252525">Fila durante falha e recuperação</text><text x="16" y="56" font-size="14" text-anchor="start" fill="#252525">Pendentes (mil eventos)</text><path d="M60 300.0 H330" stroke="#d4d4cf"/><text x="50" y="305.0" font-size="13" text-anchor="end" fill="#252525">0</text><path d="M60 247.5 H330" stroke="#d4d4cf"/><text x="50" y="252.5" font-size="13" text-anchor="end" fill="#252525">3</text><path d="M60 195.0 H330" stroke="#d4d4cf"/><text x="50" y="200.0" font-size="13" text-anchor="end" fill="#252525">6</text><path d="M60 142.5 H330" stroke="#d4d4cf"/><text x="50" y="147.5" font-size="13" text-anchor="end" fill="#252525">9</text><path d="M60 90.0 H330" stroke="#d4d4cf"/><text x="50" y="95.0" font-size="13" text-anchor="end" fill="#252525">12</text><path d="M60 85 V300 H330" fill="none" stroke="#252525" stroke-width="2"/><text x="60.0" y="321" font-size="13" text-anchor="middle" fill="#252525">0</text><text x="114.0" y="321" font-size="13" text-anchor="middle" fill="#252525">20</text><text x="168.0" y="321" font-size="13" text-anchor="middle" fill="#252525">40</text><text x="222.0" y="321" font-size="13" text-anchor="middle" fill="#252525">60</text><text x="276.0" y="321" font-size="13" text-anchor="middle" fill="#252525">80</text><text x="330.0" y="321" font-size="13" text-anchor="middle" fill="#252525">100</text><path d="M60 300 L222 90" fill="none" stroke="#9a542b" stroke-width="3"/><path d="M222 90 L330 300" fill="none" stroke="#277d69" stroke-width="3" stroke-dasharray="7 4"/><text x="180" y="346" font-size="14" text-anchor="middle" fill="#252525">Tempo desde a falha (s)</text><text x="220" y="77" font-size="14" text-anchor="middle" fill="#252525">12 mil</text><path d="M24 374 H57" stroke="#9a542b" stroke-width="3"/><text x="68" y="379" font-size="14" text-anchor="start" fill="#252525">Falha: saída = 0 eventos/s</text><path d="M24 404 H57" stroke="#277d69" stroke-width="3" stroke-dasharray="7 4"/><text x="68" y="409" font-size="14" text-anchor="start" fill="#252525">Recuperação: saída = 500/s</text><text x="180" y="442" font-size="14" text-anchor="middle" fill="#252525">Entrada constante: 200 eventos/s</text><text x="180" y="466" font-size="13" text-anchor="middle" fill="#252525">Modelo calculado; não é medição</text></g></svg>