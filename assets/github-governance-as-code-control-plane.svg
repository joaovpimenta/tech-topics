<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="t d"><title id="t">Arquitetura de governança como código no GitHub</title><desc id="d">Um repositório controlador mantém política e templates, descobre repositórios, instala pequenos gatilhos e reconcilia Issues e um Project central.</desc><rect width="1100" height="560" rx="24" fill="#f5f1e8"/><g font-family="system-ui, sans-serif" fill="#24292f"><rect x="60" y="70" width="280" height="160" rx="18" fill="#dce6e9" stroke="#6e8e9b" stroke-width="3"/><text x="200" y="112" text-anchor="middle" font-size="24" font-weight="700">Controlador</text><text x="200" y="148" text-anchor="middle" font-size="18">taxonomia + templates</text><text x="200" y="178" text-anchor="middle" font-size="18">reconciler + workflows</text><text x="200" y="208" text-anchor="middle" font-size="18">desired state</text><rect x="430" y="45" width="260" height="110" rx="18" fill="#e7dfcf" stroke="#c3a87d" stroke-width="3"/><text x="560" y="88" text-anchor="middle" font-size="22" font-weight="700">Repo A</text><text x="560" y="120" text-anchor="middle" font-size="17">Issue Form + caller</text><rect x="430" y="190" width="260" height="110" rx="18" fill="#e1e8d7" stroke="#83936c" stroke-width="3"/><text x="560" y="233" text-anchor="middle" font-size="22" font-weight="700">Repo B</text><text x="560" y="265" text-anchor="middle" font-size="17">Issue Form + caller</text><rect x="430" y="335" width="260" height="110" rx="18" fill="#ead9d2" stroke="#b56d4f" stroke-width="3"/><text x="560" y="378" text-anchor="middle" font-size="22" font-weight="700">Repo N</text><text x="560" y="410" text-anchor="middle" font-size="17">Issue Form + caller</text><rect x="790" y="150" width="250" height="180" rx="18" fill="#dde3e6" stroke="#4f514e" stroke-width="3"/><text x="915" y="195" text-anchor="middle" font-size="24" font-weight="700">Project central</text><text x="915" y="232" text-anchor="middle" font-size="18">Status · Priority</text><text x="915" y="262" text-anchor="middle" font-size="18">Organization · Product</text><text x="915" y="292" text-anchor="middle" font-size="18">Type · Area · Views</text><rect x="75" y="350" width="250" height="120" rx="18" fill="#fff" stroke="#8c959f" stroke-width="2"/><text x="200" y="390" text-anchor="middle" font-size="20" font-weight="700">Reconciler periódico</text><text x="200" y="422" text-anchor="middle" font-size="16">corrige drift e históricos</text><text x="200" y="450" text-anchor="middle" font-size="16">idempotente + dry run</text></g><g fill="none" stroke="#4f514e" stroke-width="4" marker-end="url(#a)"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f514e"/></marker></defs><path d="M340 120 C385 120 395 100 430 100"/><path d="M340 150 C390 170 390 230 430 245"/><path d="M340 180 C390 245 390 375 430 390"/><path d="M690 100 C745 100 760 180 790 200"/><path d="M690 245 C740 245 750 240 790 240"/><path d="M690 390 C745 390 755 300 790 282"/><path d="M200 350 C200 300 200 270 200 230"/></g></svg>